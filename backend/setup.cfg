# ── flake8 style configuration ─────────────────────────────────────────────────
[flake8]
max-line-length = 100
extend-ignore = E501, W503, E402
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    *.egg-info,
    dist,
    build,
    tests/
per-file-ignores =
    __init__.py:F401

# ── pytest configuration ────────────────────────────────────────────────────────
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
