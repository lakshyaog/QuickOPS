# ── flake8 style configuration ─────────────────────────────────────────────────
[flake8]
max-line-length = 100
# Ignore common FastAPI / SQLAlchemy patterns
extend-ignore =
    E501,   # line too long  (handled by max-line-length above)
    W503,   # line break before binary operator (conflicts with Black)
    E402,   # module level import not at top of file
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    *.egg-info,
    dist,
    build,
    tests/
per-file-ignores =
    # allow unused imports in __init__ files
    __init__.py:F401

# ── pytest configuration ────────────────────────────────────────────────────────
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Show extra summary for failures/errors
addopts = -v --tb=short
