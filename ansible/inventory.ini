# QuickOPS Ansible Inventory

# Remote production/staging servers (example target hosts)
[servers]
# server1.example.com ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519
# server2.example.com ansible_host=203.0.113.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Local Docker-based test node (for local testing & idempotency verification)
[test_nodes]
quickops-node ansible_connection=docker ansible_user=root

# Group aliases
[k8s_nodes:children]
servers
test_nodes

[all:vars]
ansible_python_interpreter=/usr/bin/python3
