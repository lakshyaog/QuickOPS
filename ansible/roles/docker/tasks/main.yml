---
# ==============================================================================
# Role: docker
# Configures official Docker CE repository, packages, daemon.json, and group.
# ==============================================================================

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG ASCII key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: no

- name: Add Docker official APT repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: ["https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc
    architectures: ["{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"]
    state: present
  register: docker_repo_added

- name: Update apt cache if Docker repository was updated
  ansible.builtin.apt:
    update_cache: yes
  when: docker_repo_added.changed

- name: Install Docker CE, containerd, and Docker CLI plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker daemon (/etc/docker/daemon.json)
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  when: ansible_facts['virtualization_type'] is not defined or ansible_facts['virtualization_type'] != 'docker'
  failed_when: false

- name: Ensure devops user is part of the docker group
  ansible.builtin.user:
    name: "{{ devops_user }}"
    groups: docker
    append: yes
